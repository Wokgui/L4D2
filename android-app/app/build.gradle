plugins { id 'com.android.application' }
android {
 namespace 'com.wokgui.l4d2'
 compileSdk 35
 defaultConfig { applicationId 'com.wokgui.l4d2'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
 signingConfigs { stable { storeFile file(System.getenv('WOKGUI_NATIVE_KEYSTORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.stable } }
}
def webAssets = layout.buildDirectory.dir('generated/web-assets')
tasks.register('prepareWebAssets', Sync) {
 filteringCharset = 'UTF-8'
 from(rootProject.projectDir.parentFile) {
 include '*.html','*.css','*.js','*.json','*.webmanifest','*.png','*.jpg','*.webp','*.svg','assets/**','icons/**','vendor/**','services/**'
 exclude 'package*.json','vercel.json'
 filesMatching(['*.html','*.js']) { filter { line ->
 def text = line.replace('if("serviceWorker" in navigator','if(!window.NativeShell && "serviceWorker" in navigator')
 if (name == 'index.html') text = text.replace('<head>', '<head><script src="/native-bootstrap.js"></script><style>#app-startup-icon{display:none!important}</style>')
 return text
 } }
 }
 from('src/main/native')
 into(webAssets.map { it.dir('site') })
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild').configure { dependsOn('prepareWebAssets') }
