name: Build stable splash icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-splash-icon.yml"

permissions:
  contents: write

jobs:
  build-splash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create centered splash icon and update PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, re

          src_path = Path('l4d2-maskable-512-v53.png')
          out_path = Path('l4d2-splash-512-v96.png')

          src = Image.open(src_path).convert('RGBA')
          src.thumbnail((320, 320), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (512, 512), (246, 239, 226, 255))
          x = (512 - src.width) // 2
          y = (512 - src.height) // 2
          canvas.alpha_composite(src, (x, y))
          canvas.convert('RGB').save(out_path, 'PNG', optimize=True)

          manifest_path = Path('manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['start_url'] = '/?v=20260815-96'
          manifest['background_color'] = '#F6EFE2'
          manifest['theme_color'] = '#F6EFE2'
          icon = {
              'src': '/l4d2-splash-512-v96.png',
              'sizes': '512x512',
              'type': 'image/png'
          }
          manifest['icons'] = [
              {**icon, 'purpose': 'any'},
              {**icon, 'purpose': 'maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace('catalogue-l4d2-20260815-95', 'catalogue-l4d2-20260815-96')
          sw = sw.replace('/l4d2-maskable-512-v53.png?v=95', '/l4d2-splash-512-v96.png')
          sw = sw.replace('/l4d2-maskable-512-v53.png', '/l4d2-splash-512-v96.png')
          sw = sw.replace('/manifest.webmanifest?v=20260815-95', '/manifest.webmanifest?v=20260815-96')
          sw_path.write_text(sw, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'/manifest\.webmanifest\?v=[^\"\']+', '/manifest.webmanifest?v=20260815-96', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          workflow = Path('.github/workflows/build-splash-icon.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit final splash
        run: |
          git config user.name "Wokgui"
          git config user.email "149906755+Wokgui@users.noreply.github.com"
          git add -A
          git commit -m "Stabiliser l’icône de splash sur fond crème"
          git push
